<svg xmlns="http://www.w3.org/2000/svg" width="830" height="938" viewBox="0 0 830 938"><rect x="0" y="0" width="830" height="938" rx="0" fill="#1a1a1a" fill-opacity="1.0"/><path d="M34 21 l-7 12 h6 l-3 10 l9 -14 h-6 l3 -8 z" fill="#00ae42"/><text x="50" y="38" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" fill="#ffffff" font-weight="600" text-anchor="start">Peak Energy Scheduling</text><text x="20" y="64" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#808080" font-weight="400" text-anchor="start">Keep queued prints and AMS drying out of the hours your electricity costs more.</text><rect x="20" y="84" width="790" height="834" rx="12" fill="#2d2d2d" fill-opacity="1.0" stroke="#3d3d3d" stroke-width="1"/><text x="40" y="110" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start">Avoid peak hours</text><text x="40" y="128" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">The queue holds jobs that would start during peak hours.</text><rect x="746" y="98" width="44" height="24" rx="12" fill="#00ae42" fill-opacity="1.0"/><circle cx="778" cy="110" r="10" fill="#ffffff"/><text x="40" y="156" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#a0a0a0" font-weight="400" text-anchor="start">Peak hours come from</text><rect x="40" y="166" width="750" height="36" rx="8" fill="#1a1a1a" fill-opacity="1.0" stroke="#3d3d3d" stroke-width="1"/><text x="52" y="189" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="400" text-anchor="start">Home Assistant entity</text><path d="M768 181 l5 5 l5 -5" stroke="#808080" stroke-width="2" fill="none"/><text x="40" y="222" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#a0a0a0" font-weight="400" text-anchor="start">Tariff entity</text><rect x="40" y="232" width="750" height="36" rx="8" fill="#1a1a1a" fill-opacity="1.0" stroke="#00ae42" stroke-width="1"/><circle cx="57" cy="248" r="5" fill="none" stroke="#808080" stroke-width="1.6"/><path d="M61 252 l4 4" stroke="#808080" stroke-width="1.6"/><text x="74" y="255" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="400" text-anchor="start">tariff</text><rect x="40" y="272" width="750" height="192" rx="8" fill="#1a1a1a" fill-opacity="1.0" stroke="#3d3d3d" stroke-width="1"/><rect x="41" y="276" width="748" height="46" rx="4" fill="#00ae42" fill-opacity="0.2"/><text x="52" y="295" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#00ae42" font-weight="500" text-anchor="start">Electricity Tariff</text><text x="52" y="313" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="start">select.electricity_tariff</text><text x="778" y="313" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="end">offpeak</text><text x="52" y="341" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="500" text-anchor="start">Peak Pricing Active</text><text x="52" y="359" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="start">binary_sensor.peak_pricing</text><text x="778" y="359" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="end">off</text><text x="52" y="387" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="500" text-anchor="start">Daily Energy Tariff</text><text x="52" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="start">select.daily_energy</text><text x="778" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="end">offpeak</text><text x="52" y="433" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="500" text-anchor="start">Monthly Energy Tariff</text><text x="52" y="451" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="start">select.monthly_energy</text><text x="778" y="451" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="end">offpeak</text><text x="40" y="478" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="start">Showing 4 select, input_select, binary_sensor and input_boolean entities</text><text x="40" y="504" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#a0a0a0" font-weight="400" text-anchor="start">States that mean peak</text><text x="790" y="504" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="end">Options of select.electricity_tariff</text><rect x="40" y="518" width="16" height="16" rx="4" fill="#00ae42" fill-opacity="1.0" stroke="#00ae42" stroke-width="1"/><path d="M44 526 l3 3 l6 -6" stroke="#ffffff" stroke-width="2" fill="none"/><text x="64" y="531" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="400" text-anchor="start">peak</text><rect x="180" y="518" width="16" height="16" rx="4" fill="#1a1a1a" fill-opacity="1.0" stroke="#808080" stroke-width="1"/><text x="204" y="531" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="400" text-anchor="start">offpeak</text><rect x="320" y="518" width="16" height="16" rx="4" fill="#1a1a1a" fill-opacity="1.0" stroke="#808080" stroke-width="1"/><text x="344" y="531" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="400" text-anchor="start">shoulder</text><rect x="40" y="554" width="750" height="40" rx="8" fill="#1a1a1a" fill-opacity="1.0"/><circle cx="58" cy="574" r="5" fill="#00ae42"/><text x="72" y="579" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="400" text-anchor="start">Now: offpeak, so jobs can start.</text><text x="40" y="610" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">Home Assistant only says whether it's peak now, so jobs wait without an end time,</text><text x="40" y="628" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">and the queue isn't held while Home Assistant can't be reached.</text><line x1="40" y1="640" x2="790" y2="640" stroke="#3d3d3d" stroke-width="1"/><text x="40" y="660" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#a0a0a0" font-weight="600" text-anchor="start">PRINTS</text><circle cx="50" cy="684" r="8" fill="none" stroke="#00ae42" stroke-width="2"/><circle cx="50" cy="684" r="4" fill="#00ae42"/><text x="68" y="689" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start">Don't start a print during peak hours</text><text x="68" y="707" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">A print that starts before peak hours may run into them.</text><circle cx="50" cy="730" r="8" fill="none" stroke="#808080" stroke-width="2"/><text x="68" y="735" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#808080" font-weight="400" text-anchor="start">Only start a print that will finish before peak hours</text><text x="68" y="753" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">Needs a weekly schedule, since Home Assistant can't say when peak starts.</text><line x1="40" y1="776" x2="790" y2="776" stroke="#3d3d3d" stroke-width="1"/><text x="40" y="796" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#a0a0a0" font-weight="600" text-anchor="start">DRYING</text><text x="40" y="826" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start">Hold drying during peak hours</text><text x="40" y="844" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">Scheduled, queue and humidity-triggered drying wait until peak hours end.</text><rect x="746" y="814" width="44" height="24" rx="12" fill="#00ae42" fill-opacity="1.0"/><circle cx="778" cy="826" r="10" fill="#ffffff"/><text x="40" y="878" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start">Stop drying when peak hours begin</text><text x="40" y="896" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">Drying that's running stops, and the rest runs afterward.</text><rect x="746" y="866" width="44" height="24" rx="12" fill="#f59e0b" fill-opacity="1.0"/><circle cx="778" cy="878" r="10" fill="#ffffff"/></svg>