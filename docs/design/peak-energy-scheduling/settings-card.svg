ze="11" fill="#808080" font-weight="400" text-anchor="start">Thu</text><rect x="80" y="426" width="640" height="12" rx="3" fill="#3d3d3d" fill-opacity="1.0"/><rect x="533.3333333333334" y="426" width="106.66666666666667" height="12" rx="3" fill="#f59e0b" fill-opacity="0.85"/><text x="40" y="454" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="start">Fri</text><rect x="80" y="444" width="640" height="12" rx="3" fill="#3d3d3d" fill-opacity="1.0"/><rect x="533.3333333333334" y="444" width="106.66666666666667" height="12" rx="3" fill="#f59e0b" fill-opacity="0.85"/><text x="40" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="start">Sat</text><rect x="80" y="462" width="640" height="12" rx="3" fill="#3d3d3d" fill-opacity="1.0"/><rect x="506.6666666666667" y="462" width="80.0" height="12" rx="3" fill="#f59e0b" fill-opacity="0.85"/><text x="40" y="490" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#808080" font-weight="400" text-anchor="start">Sun</text><rect x="80" y="480" width="640" height="12" rx="3" fill="#3d3d3d" fill-opacity="1.0"/><rect x="506.6666666666667" y="480" width="80.0" height="12" rx="3" fill="#f59e0b" fill-opacity="0.85"/><text x="80.0" y="510" font-family="Inter, DejaVu Sans, sans-serif" font-size="10" fill="#808080" font-weight="400" text-anchor="middle">00:00</text><text x="240.0" y="510" font-family="Inter, DejaVu Sans, sans-serif" font-size="10" fill="#808080" font-weight="400" text-anchor="middle">06:00</text><text x="400.0" y="510" font-family="Inter, DejaVu Sans, sans-serif" font-size="10" fill="#808080" font-weight="400" text-anchor="middle">12:00</text><text x="560.0" y="510" font-family="Inter, DejaVu Sans, sans-serif" font-size="10" fill="#808080" font-weight="400" text-anchor="middle">18:00</text><text x="720.0" y="510" font-family="Inter, DejaVu Sans, sans-serif" font-size="10" fill="#808080" font-weight="400" text-anchor="middle">24:00</text><line x1="40" y1="532" x2="740" y2="532" stroke="#3d3d3d"/><text x="40" y="552" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#a0a0a0" font-weight="600" text-anchor="start">PRINTS</text><circle cx="50" cy="576" r="8" fill="none" stroke="#00ae42" stroke-width="2"/><circle cx="50" cy="576" r="4" fill="#00ae42"/><text x="68" y="581" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start">Don't start a print during a peak window</text><text x="68" y="599" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">A print that starts before a window may run into it.</text><circle cx="50" cy="622" r="8" fill="none" stroke="#808080" stroke-width="2"/><text x="68" y="627" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start">Only start a print that will finish before the next window</text><text x="68" y="645" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">Uses the slicer estimate plus a margin. Prints too long for any gap still run off-peak.</text><text x="68" y="668" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#a0a0a0" font-weight="400" text-anchor="start">Safety margin</text><rect x="170" y="650" width="70" height="28" rx="6" fill="#1a1a1a" fill-opacity="1.0" stroke="#3d3d3d" stroke-width="1"/><text x="205" y="669" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#a0a0a0" font-weight="400" text-anchor="middle">15</text><text x="250" y="668" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">minutes</text><line x1="40" y1="688" x2="740" y2="688" stroke="#3d3d3d"/><text x="40" y="708" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" fill="#a0a0a0" font-weight="600" text-anchor="start">DRYING</text><text x="40" y="738" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start">Hold drying during peak windows</text><text x="40" y="756" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">Scheduled, queue and humidity-triggered drying wait for the window to end.</text><rect x="696" y="726" width="44" height="24" rx="12" fill="#00ae42" fill-opacity="1.0"/><circle cx="728" cy="738" r="10" fill="#ffffff"/><text x="40" y="790" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start">Stop drying when a window begins</text><text x="40" y="808" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#808080" font-weight="400" text-anchor="start">Drying running at the start of a window stops, and the rest runs after it.</text><rect x="696" y="778" width="44" height="24" rx="12" fill="#f59e0b" fill-opacity="1.0"/><circle cx="728" cy="790" r="10" fill="#ffffff"/></svg>